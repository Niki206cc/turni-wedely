services:
  turni-wedely:
    build: .
    container_name: turni-wedely
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      TZ: Europe/Rome
      PORT: "8091"
      DATA_DIR: /app/data
      HEADLESS: "true"
    volumes:
      - wedely_data:/app/data
    shm_size: "1gb"

volumes:
  wedely_data:
